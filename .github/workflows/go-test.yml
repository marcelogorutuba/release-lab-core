name: Go Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: go build + go test
    runs-on: ubuntu-latest

    # The integration tests (build tag `integration`) create their own schemas and roles,
    # so they need a superuser.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: evo_core_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      EVO_TENANT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/evo_core_test?sslmode=disable

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          # setup-go only parses go.mod / .go-version here; both modfiles pin the same
          # toolchain, so read the version from go.mod and pass the community modfile to
          # the commands below (go.mod `replace`s the enterprise SDK to a sibling
          # checkout that does not exist in CI).
          go-version-file: go.mod
          cache-dependency-path: go.community.sum

      # Mirrors the image build (Dockerfile), so a red job here means a red image.
      - name: Build
        run: go build -modfile=go.community.mod ./...

      - name: Test
        run: |
          set -o pipefail
          go test -modfile=go.community.mod -tags integration -v ./... 2>&1 | tee go-test.log

      # An integration test skips itself when its database is missing; that is a test
      # that did not run.
      - name: Fail on skipped tests
        run: |
          if grep -E '^[[:space:]]*--- SKIP' go-test.log; then
            echo "::error::Skipped tests count as failures (listed above)."
            exit 1
          fi
